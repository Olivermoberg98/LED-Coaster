name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/LED_coaster
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('Software/LED_coaster/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build every environment
        run: pio run -e esp32-c3-devkitm-1 -e battery-fake -e rundown

  app:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/App/Coaster_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug test lint
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: Software/App/Coaster_app/app/build/reports/

  pcb:
    name: PCB connectivity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check nets, shorts and stray copper
        run: python Hardware/PCB/tools/pcb_check.py all
