; PlatformIO Project Configuration File
;

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Serial goes to the USB-C port, not the UART header.
; The core defaults ARDUINO_USB_CDC_ON_BOOT to 0, which makes Serial UART0 on
; IO20/IO21 - the J4 header, which is DNP and therefore not fitted. Setting it
; to 1 makes Serial the USB-Serial-JTAG peripheral instead, reached through
; J3's D+/D- (22R via R10/R11 to IO18/IO19). UART0 is still there as Serial0.
;
; Both flags are needed. HWCDC.h only declares Serial inside `#if
; ARDUINO_USB_MODE`, so setting CDC_ON_BOOT alone renames the UART instance to
; Serial0 and declares no Serial at all - the build fails with 'Serial' was
; not declared in this scope.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

lib_deps =
	fastled/FastLED@^3.8.0
	h2zero/NimBLE-Arduino@^1.4.2
